name: SkyLog Windows desktop
on:
  workflow_dispatch:
  push:
    paths: ['desktop/**', 'shared/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['desktop/**', 'shared/**', '.github/workflows/windows-desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r desktop/requirements-lock.txt
      - name: Build and test portable Windows app
        shell: pwsh
        run: desktop/scripts/build.ps1
      - name: Smoke test compiled executable
        shell: pwsh
        run: |
          $p=Start-Process desktop/dist/SkyLog1090/SkyLog1090.exe -ArgumentList '--demo','--smoke-test','--data-dir',"$env:RUNNER_TEMP/skylog-smoke" -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Compiled app failed smoke test' }
      - uses: actions/upload-artifact@v4
        with:
          name: SkyLog1090-Windows-x64
          path: desktop/dist/*.zip
          retention-days: 30
