name: ADS-B Logger APK and tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: adsb-logger-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'
  NDK_VERSION: '27.0.12077973'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-9gradio-adsb-debug-keystore-v1
      - name: Install Android SDK, NDK and CMake
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' "ndk;$NDK_VERSION"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Use runner JDK and generate complete Gradle wrapper
        run: |
          # Upstream pins a JetBrains daemon JVM. CI uses the provisioned Temurin 21.
          # Keep the upstream file in the repository; override it only in this checkout.
          mv gradle/gradle-daemon-jvm.properties "$RUNNER_TEMP/upstream-daemon-jvm.properties"
          gradle --no-daemon wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          chmod +x gradlew
      - name: Static checks and production SQL tests
        run: |
          python3 scripts/check_static.py
          python3 scripts/check_sql.py
      - name: Unit tests and debug APKs for every existing ABI
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/9GRadio-ADS-B-Logger-debug.apk
          cp app/build/outputs/apk/androidTest/debug/*.apk artifacts/9GRadio-ADS-B-Logger-tests.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 9GRadio-ADS-B-Logger-debug
          path: artifacts/9GRadio-ADS-B-Logger-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 9GRadio-ADS-B-Logger-tests
          path: artifacts/9GRadio-ADS-B-Logger-tests.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-and-room-schema
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/schemas/
          if-no-files-found: warn

  android-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: 9GRadio-ADS-B-Logger-debug
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: 9GRadio-ADS-B-Logger-tests
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room migration, PDF and offline identity tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash .github/scripts/run-instrumentation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: instrumentation.txt
          if-no-files-found: warn
